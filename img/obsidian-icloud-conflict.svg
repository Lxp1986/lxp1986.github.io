<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="640" height="430" fill="#fafafa"/>
  <rect x="10" y="10" width="620" height="410" rx="8" fill="none" stroke="#d0d0d0"/>

  <!-- 设备A -->
  <rect x="40" y="50" width="200" height="64" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
  <text x="140" y="76" text-anchor="middle" font-size="14" fill="#333333">设备A：MacBook</text>
  <text x="140" y="98" text-anchor="middle" font-size="12" fill="#666666">正在编辑 note.md</text>

  <!-- 设备B -->
  <rect x="400" y="50" width="200" height="64" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
  <text x="500" y="76" text-anchor="middle" font-size="14" fill="#333333">设备B：脚本 / 另一台机器</text>
  <text x="500" y="98" text-anchor="middle" font-size="12" fill="#666666">也在写 note.md</text>

  <!-- 箭头到云 -->
  <path d="M140 114 L140 148 L215 148" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M500 114 L500 148 L425 148" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="#c0392b">几乎同时保存，互相没看到对方的版本</text>

  <!-- iCloud 云 -->
  <g transform="translate(215,155)">
    <ellipse cx="105" cy="40" rx="105" ry="36" fill="#e3f0fb" stroke="#7ba7c9" stroke-width="1.5"/>
    <ellipse cx="70" cy="22" rx="42" ry="24" fill="#e3f0fb" stroke="#7ba7c9" stroke-width="1.5"/>
    <ellipse cx="140" cy="24" rx="38" ry="22" fill="#e3f0fb" stroke="#7ba7c9" stroke-width="1.5"/>
    <text x="105" y="46" text-anchor="middle" font-size="15" fill="#2d6a9f">iCloud Drive</text>
  </g>

  <!-- 云到结果 -->
  <path d="M275 233 L170 290" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M365 233 L460 290" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 结果文件 -->
  <rect x="55" y="295" width="190" height="58" rx="6" fill="#ffffff" stroke="#4a7a4a" stroke-width="1.5"/>
  <text x="150" y="318" text-anchor="middle" font-size="14" fill="#333333">note.md</text>
  <text x="150" y="340" text-anchor="middle" font-size="12" fill="#4a7a4a">原版保留</text>

  <rect x="395" y="295" width="190" height="58" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="490" y="318" text-anchor="middle" font-size="14" fill="#333333">note 2.md</text>
  <text x="490" y="340" text-anchor="middle" font-size="12" fill="#c0392b">iCloud 自动改名，不提示</text>

  <text x="320" y="392" text-anchor="middle" font-size="13" fill="#555555">iCloud 不合并、不提示，两个版本都留着，冲突副本就这样产生</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#888888"/>
    </marker>
  </defs>
</svg>
