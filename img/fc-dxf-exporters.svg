<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="fc-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#7C5CD6"/>
    </linearGradient>
  </defs>

  <rect width="980" height="460" rx="18" fill="#F6F8FB"/>
  <text x="490" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1E2A3B">两种 DXF 导出器差在哪</text>
  <text x="490" y="74" text-anchor="middle" font-size="14" fill="#64748B">默认 C++ 导出器快但丢东西，旧版 Python 导出器才是全功能</text>

  <!-- 表头 -->
  <rect x="70" y="100" width="860" height="46" rx="10" fill="url(#fc-head)"/>
  <text x="185" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">功能</text>
  <text x="458" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">C++ 导出器（默认）</text>
  <text x="772" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">旧版 Python 导出器</text>

  <!-- 数据行 -->
  <g font-size="15">
    <!-- 行1 -->
    <rect x="70" y="146" width="860" height="44" fill="#FFF"/>
    <text x="90" y="173" fill="#1E2A3B">文字与标注</text>
    <circle cx="422" cy="168" r="13" fill="#FEF2F2"/>
    <text x="458" y="173" text-anchor="middle" font-weight="700" fill="#DC2626">✗ 不导出</text>
    <circle cx="736" cy="168" r="13" fill="#ECFDF5"/>
    <text x="772" y="173" text-anchor="middle" font-weight="700" fill="#16A34A">✓ 导出</text>

    <!-- 行2 -->
    <rect x="70" y="190" width="860" height="44" fill="#FBFCFE"/>
    <text x="90" y="217" fill="#1E2A3B">颜色</text>
    <text x="458" y="217" text-anchor="middle" fill="#64748B">✗ 不导出</text>
    <text x="772" y="217" text-anchor="middle" fill="#16A34A">✓ 按对象线色</text>

    <!-- 行3 -->
    <rect x="70" y="234" width="860" height="44" fill="#FFF"/>
    <text x="90" y="261" fill="#1E2A3B">图层</text>
    <text x="458" y="261" text-anchor="middle" fill="#94A3B8">✓ 按对象名</text>
    <text x="772" y="261" text-anchor="middle" fill="#16A34A">✓ 按 Draft 图层/组</text>

    <!-- 行4 -->
    <rect x="70" y="278" width="860" height="44" fill="#FBFCFE"/>
    <text x="90" y="305" fill="#1E2A3B">组与块</text>
    <text x="458" y="305" text-anchor="middle" fill="#64748B">✗ 不导出</text>
    <text x="772" y="305" text-anchor="middle" fill="#16A34A">✓ 导出为块</text>

    <!-- 行5 -->
    <rect x="70" y="322" width="860" height="44" fill="#FFF"/>
    <text x="90" y="349" fill="#1E2A3B">椭圆 / 样条</text>
    <text x="458" y="349" text-anchor="middle" fill="#16A34A">✓ 支持</text>
    <text x="772" y="349" text-anchor="middle" fill="#DC2626">✗ 易出问题</text>

    <!-- 行6 -->
    <rect x="70" y="366" width="860" height="44" fill="#FBFCFE"/>
    <text x="90" y="393" fill="#1E2A3B">速度</text>
    <text x="458" y="393" text-anchor="middle" fill="#16A34A">快</text>
    <text x="772" y="393" text-anchor="middle" fill="#DC2626">慢</text>
  </g>
  <line x1="70" y1="146" x2="930" y2="146" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="190" x2="930" y2="190" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="234" x2="930" y2="234" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="278" x2="930" y2="278" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="322" x2="930" y2="322" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="366" x2="930" y2="366" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 底部提示 -->
  <rect x="70" y="418" width="860" height="40" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="490" y="443" text-anchor="middle" font-size="14" fill="#334155">设置：编辑 → 偏好设置 → 导入/导出 → DXF，勾选<span font-weight="700" fill="#5B8DEF">「使用旧版 Python 导出器」</span></text>
</svg>
