<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="ff-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A3B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="ff-step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#7C5CD6"/>
    </linearGradient>
    <marker id="ff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="18" fill="#F6F8FB"/>
  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1E2A3B">Firefox for iOS 内置广告拦截：三步开启</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#64748B">experimental 功能 · 灰度推送 · 网络层过滤 · 规则基于 EasyList 广告黑名单</text>

  <!-- step 1 -->
  <rect x="90" y="110" width="300" height="180" rx="12" fill="url(#ff-step)"/>
  <text x="240" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">第 1 步 · 装 Firefox</text>
  <text x="240" y="182" text-anchor="middle" font-size="13" fill="#EDE9FE">App Store 搜 Firefox 安装</text>
  <text x="240" y="206" text-anchor="middle" font-size="13" fill="#EDE9FE">（国内商店直接下，不用翻墙）</text>
  <text x="240" y="236" text-anchor="middle" font-size="13" fill="#EDE9FE">把版本更新到最新</text>
  <text x="240" y="266" text-anchor="middle" font-size="12" fill="#C4B5FD">功能灰度推送，没出现就等几天</text>

  <line x1="390" y1="200" x2="440" y2="200" stroke="#94A3B8" stroke-width="3" marker-end="url(#ff-arrow)"/>

  <!-- step 2 -->
  <rect x="450" y="110" width="300" height="180" rx="12" fill="url(#ff-step)"/>
  <text x="600" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">第 2 步 · 打开任意网页</text>
  <text x="600" y="182" text-anchor="middle" font-size="13" fill="#EDE9FE">点右上角菜单按钮</text>
  <text x="600" y="206" text-anchor="middle" font-size="13" fill="#EDE9FE">进入 Site menu（站点菜单）</text>
  <text x="600" y="236" text-anchor="middle" font-size="13" fill="#EDE9FE">中文版菜单名可能略不同</text>
  <text x="600" y="266" text-anchor="middle" font-size="12" fill="#C4B5FD">菜单里有「Ad Blocker」一项</text>

  <line x1="750" y1="200" x2="800" y2="200" stroke="#94A3B8" stroke-width="3" marker-end="url(#ff-arrow)"/>

  <!-- step 3 -->
  <rect x="810" y="110" width="300" height="180" rx="12" fill="url(#ff-step)"/>
  <text x="960" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">第 3 步 · 打开开关</text>
  <text x="960" y="182" text-anchor="middle" font-size="13" fill="#EDE9FE">点 Ad Blocker 进设置</text>
  <text x="960" y="206" text-anchor="middle" font-size="13" fill="#EDE9FE">把开关拨到开</text>
  <text x="960" y="236" text-anchor="middle" font-size="13" fill="#EDE9FE">刷新一下当前页面</text>
  <text x="960" y="266" text-anchor="middle" font-size="12" fill="#C4B5FD">广告立刻就少了</text>

  <!-- bottom: what it blocks / not -->
  <rect x="90" y="330" width="520" height="250" rx="12" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="350" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#065F46">🟢 能拦：第三方广告和追踪</text>
  <rect x="112" y="388" width="476" height="42" rx="8" fill="#ECFDF5"/>
  <text x="350" y="414" text-anchor="middle" font-size="13" fill="#065F46">第三方广告网络和广告交易所的广告</text>
  <rect x="112" y="438" width="476" height="42" rx="8" fill="#ECFDF5"/>
  <text x="350" y="464" text-anchor="middle" font-size="13" fill="#065F46">广告相关追踪器（网站之间跟你的那种）</text>
  <rect x="112" y="488" width="476" height="42" rx="8" fill="#ECFDF5"/>
  <text x="350" y="514" text-anchor="middle" font-size="13" fill="#065F46">弹窗、遮罩层等强打扰形式</text>
  <rect x="112" y="538" width="476" height="36" rx="8" fill="#ECFDF5"/>
  <text x="350" y="560" text-anchor="middle" font-size="13" fill="#065F46">网络层拦截，页面加载前就过滤掉</text>

  <rect x="630" y="330" width="480" height="250" rx="12" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="870" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#9F1239">🔴 不拦：搜索页和自家广告</text>
  <rect x="652" y="388" width="436" height="42" rx="8" fill="#FFF1F2"/>
  <text x="870" y="414" text-anchor="middle" font-size="13" fill="#9F1239">搜索引擎结果页的广告（Google / Bing /</text>
  <text x="870" y="430" text-anchor="middle" font-size="13" fill="#9F1239">DuckDuckGo 的搜索结果推广位）</text>
  <rect x="652" y="440" width="436" height="42" rx="8" fill="#FFF1F2"/>
  <text x="870" y="466" text-anchor="middle" font-size="13" fill="#9F1239">Firefox 新标签页的赞助内容</text>
  <rect x="652" y="490" width="436" height="42" rx="8" fill="#FFF1F2"/>
  <text x="870" y="516" text-anchor="middle" font-size="13" fill="#9F1239">网站自身投放的第一方广告</text>
  <rect x="652" y="540" width="436" height="36" rx="8" fill="#FFF1F2"/>
  <text x="870" y="562" text-anchor="middle" font-size="13" fill="#9F1239">原因：Mozilla 收入大头来自搜索分成</text>
</svg>
