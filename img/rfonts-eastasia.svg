<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#FAFAF8"/>
  <text x="40" y="26" font-size="13" fill="#999">python-docx 中文字体设置原理：font.name 与 eastAsia 的关系</text>

  <!-- run 框 -->
  <rect x="40" y="44" width="600" height="60" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="60" y="72" font-size="17" fill="#333333">run（一段文字）</text>
  <text x="60" y="93" font-size="13" fill="#888888">例：para.add_run('C25砼管座')</text>

  <!-- rPr -->
  <rect x="140" y="138" width="400" height="46" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="340" y="166" font-size="15" text-anchor="middle" fill="#333333">rPr（run 的格式属性容器）</text>

  <!-- rFonts -->
  <rect x="140" y="214" width="400" height="116" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="160" y="240" font-size="15" fill="#333333">rFonts（字体声明，三个属性各管一类字符）</text>

  <rect x="160" y="252" width="110" height="56" rx="6" fill="#FDF3E7" stroke="#C0392B" stroke-width="1.5"/>
  <text x="215" y="274" font-size="14" text-anchor="middle" fill="#C0392B">ascii</text>
  <text x="215" y="295" font-size="11" text-anchor="middle" fill="#777777">西文字母、数字</text>

  <rect x="285" y="252" width="110" height="56" rx="6" fill="#FDF3E7" stroke="#C0392B" stroke-width="1.5"/>
  <text x="340" y="274" font-size="14" text-anchor="middle" fill="#C0392B">hAnsi</text>
  <text x="340" y="295" font-size="11" text-anchor="middle" fill="#777777">西文（高字节）</text>

  <rect x="410" y="252" width="110" height="56" rx="6" fill="#EAF4EA" stroke="#1E8449" stroke-width="1.5"/>
  <text x="465" y="274" font-size="14" text-anchor="middle" fill="#1E8449">eastAsia</text>
  <text x="465" y="295" font-size="11" text-anchor="middle" fill="#777777">中文</text>

  <!-- 坑：font.name 路径 -->
  <path d="M 20 140 L 20 290 L 150 290" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="14" y="215" font-size="12.5" fill="#C0392B" transform="rotate(-90 14 215)" text-anchor="middle">坑：run.font.name='宋体' 只到这里</text>

  <!-- 对：eastAsia 路径 -->
  <path d="M 660 140 L 660 290 L 530 290" fill="none" stroke="#1E8449" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="666" y="215" font-size="12.5" fill="#1E8449" transform="rotate(90 666 215)" text-anchor="middle">对：rFonts.set(qn('w:eastAsia'),'宋体')</text>

  <!-- 结论 -->
  <rect x="40" y="352" width="600" height="52" rx="8" fill="#FFF8E1" stroke="#B8860B" stroke-width="1.2"/>
  <text x="340" y="374" font-size="13.5" text-anchor="middle" fill="#333333">结论：中文显示读的是 eastAsia，不是 ascii</text>
  <text x="340" y="394" font-size="12.5" text-anchor="middle" fill="#B8860B">eastAsia 没设 → Word 里中文退回默认字体，“宋体不生效”</text>

  <defs>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C0392B"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1E8449"/>
    </marker>
  </defs>
</svg>
