<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="780" height="240" fill="#fdfdfd"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4a6a8a"/>
    </marker>
  </defs>

  <g>
    <rect x="20"  y="70" width="150" height="78" rx="10" fill="#f4f8fc" stroke="#4a6a8a" stroke-width="1.6"/>
    <rect x="215" y="70" width="150" height="78" rx="10" fill="#f4f8fc" stroke="#4a6a8a" stroke-width="1.6"/>
    <rect x="410" y="70" width="150" height="78" rx="10" fill="#f4f8fc" stroke="#4a6a8a" stroke-width="1.6"/>
    <rect x="605" y="70" width="155" height="78" rx="10" fill="#f4f8fc" stroke="#4a6a8a" stroke-width="1.6"/>
  </g>

  <text x="95"  y="102" text-anchor="middle" font-size="16" fill="#222">DXF 图纸</text>
  <text x="95"  y="128" text-anchor="middle" font-size="12" fill="#667">单个文件或整个目录</text>
  <text x="290" y="102" text-anchor="middle" font-size="16" fill="#222">freecadcmd 导入</text>
  <text x="290" y="128" text-anchor="middle" font-size="12" fill="#667">圆、多段线变 FreeCAD 对象</text>
  <text x="485" y="102" text-anchor="middle" font-size="16" fill="#222">闭合线生成面</text>
  <text x="485" y="128" text-anchor="middle" font-size="12" fill="#667">按图层分组</text>
  <text x="682" y="102" text-anchor="middle" font-size="16" fill="#222">输出面积表</text>
  <text x="682" y="128" text-anchor="middle" font-size="12" fill="#667">换算 m²，报未闭合线</text>

  <line x1="170" y1="109" x2="211" y2="109" stroke="#4a6a8a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="365" y1="109" x2="406" y2="109" stroke="#4a6a8a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="560" y1="109" x2="601" y2="109" stroke="#4a6a8a" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="390" y="196" text-anchor="middle" font-size="13" fill="#445">图纸在头部声明了单位（INSUNITS）会自动换算；没声明的按 mm 或 m 读，</text>
  <text x="390" y="218" text-anchor="middle" font-size="13" fill="#445">拿不准就先用 LibreCAD 量一段标了尺寸的线核对比例，再定 mm/m。</text>
</svg>
