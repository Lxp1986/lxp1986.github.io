<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="760" height="286" fill="#f7f9fb"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#1f2d3d">qpdf 处理扫描件的三条常用路线</text>

  <!-- 左列：素材 -->
  <rect x="24" y="52" width="176" height="52" rx="6" fill="#ffffff" stroke="#8fa3b8"/>
  <text x="112" y="74" font-size="12.5" fill="#1f2d3d" text-anchor="middle">手机拍的签证单 01/02/03.pdf</text>
  <text x="112" y="92" font-size="11.5" fill="#6b7c93" text-anchor="middle">能打开、能打印</text>

  <rect x="24" y="116" width="176" height="52" rx="6" fill="#ffffff" stroke="#8fa3b8"/>
  <text x="112" y="138" font-size="12.5" fill="#1f2d3d" text-anchor="middle">监理发来的带锁 PDF</text>
  <text x="112" y="156" font-size="11.5" fill="#6b7c93" text-anchor="middle">禁打印、禁复制</text>

  <rect x="24" y="180" width="176" height="52" rx="6" fill="#ffffff" stroke="#8fa3b8"/>
  <text x="112" y="202" font-size="12.5" fill="#1f2d3d" text-anchor="middle">甲方给的加密图纸</text>
  <text x="112" y="220" font-size="11.5" fill="#6b7c93" text-anchor="middle">打开要输密码</text>

  <!-- 箭头 -->
  <line x1="200" y1="78" x2="258" y2="120" stroke="#8fa3b8" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="200" y1="142" x2="258" y2="142" stroke="#8fa3b8" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="200" y1="206" x2="258" y2="166" stroke="#8fa3b8" stroke-width="1.2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8fa3b8"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2f6f4f"/>
    </marker>
  </defs>

  <!-- 中列：命令 -->
  <rect x="262" y="52" width="222" height="180" rx="6" fill="#ffffff" stroke="#2f6f4f"/>
  <text x="278" y="76" font-size="12.5" fill="#2f6f4f" font-weight="600">第一步 先统一成可读的 PDF</text>
  <text x="278" y="100" font-size="12" fill="#1f2d3d" font-family="ui-monospace, Menlo, monospace">qpdf --decrypt 锁定.pdf 可打印.pdf</text>
  <text x="278" y="122" font-size="12" fill="#1f2d3d" font-family="ui-monospace, Menlo, monospace">qpdf --password=1234 --decrypt \</text>
  <text x="290" y="140" font-size="12" fill="#1f2d3d" font-family="ui-monospace, Menlo, monospace">加密图纸.pdf 图纸.pdf</text>
  <text x="278" y="166" font-size="11.5" fill="#6b7c93">打开密码为空 → 直接 --decrypt</text>
  <text x="278" y="184" font-size="11.5" fill="#6b7c93">有打开密码 → 加 --password=</text>
  <line x1="283" y1="196" x2="463" y2="196" stroke="#dbe3ec" stroke-width="1"/>
  <text x="278" y="216" font-size="11.5" fill="#6b7c93">合并前先 --show-encryption 看清锁了什么</text>

  <!-- 箭头 -->
  <line x1="484" y1="142" x2="542" y2="142" stroke="#2f6f4f" stroke-width="1.4" marker-end="url(#b)"/>

  <!-- 右列：结果 -->
  <rect x="546" y="52" width="190" height="180" rx="6" fill="#ffffff" stroke="#8fa3b8"/>
  <text x="562" y="76" font-size="12.5" fill="#1f2d3d" font-weight="600">第二步 按页序合并交付</text>
  <text x="562" y="98" font-size="11.5" fill="#1f2d3d" font-family="ui-monospace, Menlo, monospace">qpdf --empty --pages \</text>
  <text x="574" y="114" font-size="11.5" fill="#1f2d3d" font-family="ui-monospace, Menlo, monospace">01.pdf 02.pdf 03.pdf \</text>
  <text x="574" y="130" font-size="11.5" fill="#1f2d3d" font-family="ui-monospace, Menlo, monospace">-- 收方资料.pdf</text>
  <text x="562" y="156" font-size="11.5" fill="#6b7c93">最后的位置参数才是输出文件</text>
  <line x1="562" y1="168" x2="720" y2="168" stroke="#dbe3ec" stroke-width="1"/>
  <text x="562" y="188" font-size="11.5" fill="#1f2d3d" font-family="ui-monospace, Menlo, monospace">qpdf --linearize in.pdf out.pdf</text>
  <text x="562" y="206" font-size="11.5" fill="#6b7c93">提交前线性化，网页先出第一页</text>
  <text x="562" y="224" font-size="11.5" fill="#6b7c93">不改图，扫描件清晰度不变</text>

  <text x="24" y="266" font-size="11.5" fill="#6b7c93">qpdf 12.4.1（brew install qpdf）｜页码写法：全部 1-z，指定段 2-4，单页 3</text>
</svg>
